name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare desktop project
        shell: pwsh
        run: |
          New-Item -ItemType Directory desk | Out-Null
          Copy-Item main.js, index.html desk/
          Copy-Item icon-only.png desk/icon.png
          Copy-Item desktop-package.json desk/package.json
      - name: Build installer
        working-directory: desk
        run: |
          npm install
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mozgohran-windows
          path: desk/dist/*.exe
