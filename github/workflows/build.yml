name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Capacitor project
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Мозгохран" com.vlad.konspekty --web-dir www
          npx cap add android
          mkdir assets && cp icon-only.png icon-foreground.png icon-background.png assets/
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android
          npx cap sync android
          mkdir -p ~/.android && base64 -d keystore.txt > ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: konspekty-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
