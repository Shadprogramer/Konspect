<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Конспекты</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mut:#667085;--line:#d5dbe3;--hl:#f2d13b;--acc:#2a4d8f;--red:#b3402f}
@media(prefers-color-scheme:dark){:root{--bg:#141a22;--card:#1d2631;--ink:#e8edf3;--mut:#93a0b1;--line:#2d3947;--hl:#d9b92a;--acc:#8fb0ee;--red:#e08a7a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,'Times New Roman',serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:2px solid var(--ink)}
header h1{flex:1;margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:14px 14px 90px;max-width:720px;margin:auto}
button,.btn{font:inherit;font-size:15px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer}
button.pri{background:var(--hl);color:#1b2430;font-weight:bold}
button.sm{padding:3px 9px;font-size:14px}
button.dng{color:var(--red);border-color:var(--red)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:9px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.book{background:var(--card);border:1.5px solid var(--ink);border-radius:4px 10px 10px 4px;overflow:hidden;cursor:pointer;box-shadow:5px 5px 0 var(--line)}
.book .cv{aspect-ratio:3/4;background:var(--line) center/cover;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--mut)}
.book .t{padding:8px 10px;font-size:15px;line-height:1.3}.book .t small{color:var(--mut);display:block}
.row{display:flex;gap:8px;align-items:center}.row>.g{flex:1}
.ch{margin:16px 0 6px;display:flex;align-items:center;gap:6px;font-weight:bold;font-size:18px;border-bottom:1.5px solid var(--line);padding-bottom:4px}
.ch span{flex:1}
.pr{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--card);border:1.5px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer}
.pr span{flex:1}.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}.dot.f{background:var(--acc)}.dot.r{background:var(--hl);border:1.5px solid var(--ink)}
label{display:block;font-size:15px;color:var(--mut);margin:16px 0 4px}
label.hl b{background:var(--hl);color:#1b2430;padding:0 5px}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:22px;margin:14px 0;min-height:200px;white-space:pre-wrap}
.mut{color:var(--mut)}.emp{text-align:center;color:var(--mut);padding:40px 10px}
.hit{padding:10px 12px;background:var(--card);border:1.5px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer}
.hit small{color:var(--mut);display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0)}
nav a{flex:1;text-align:center;padding:12px 4px;color:var(--ink);text-decoration:none;font-size:15px}
nav a.on{background:var(--hl);color:#1b2430;font-weight:bold}
@media(prefers-reduced-motion:no-preference){button:active{transform:translateY(1px)}}
</style></head><body>
<header><h1 id="ttl">Конспекты</h1><span id="act"></span></header>
<main id="app"></main>
<nav><a href="#/" id="n1">Книги</a><a href="#/s" id="n2">Поиск</a><a href="#/r" id="n3">Повторение</a><a href="#/x" id="n4">Копия</a></nav>
<script>
let S;try{S=JSON.parse(localStorage.getItem('lib')||'')||{books:[]}}catch(e){S={books:[]}}
const save=()=>{try{localStorage.setItem('lib',JSON.stringify(S))}catch(e){alert('Память заполнена. Сделай копию и удали лишнее.')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s),app=$('#app');
const book=id=>S.books.find(b=>b.id==id);
const go=h=>{location.hash=h};
let rv={q:[],i:0,open:false};

function head(t,a){$('#ttl').textContent=t;$('#act').innerHTML=a||''}
function render(){
 const h=location.hash.slice(1)||'/',p=h.split('/');
 ['n1','n2','n3','n4'].forEach(i=>$('#'+i).classList.remove('on'));
 if(h=='/'){$('#n1').classList.add('on');lib()}
 else if(p[1]=='b'){$('#n1').classList.add('on');bk(p[2])}
 else if(p[1]=='p'){$('#n1').classList.add('on');note(p[2],p[3],p[4])}
 else if(p[1]=='s'){$('#n2').classList.add('on');srch()}
 else if(p[1]=='r'){$('#n3').classList.add('on');rvw(p[2])}
 else if(p[1]=='x'){$('#n4').classList.add('on');bkp()}
 else lib();
 window.scrollTo(0,0)}
addEventListener('hashchange',render);

function lib(){
 head('Мои книги','<button class="pri" onclick="addBook()">+ Книга</button>');
 app.innerHTML=S.books.length?'<div class="grid">'+S.books.map(b=>`<div class="book" onclick="go('/b/${b.id}')"><div class="cv" style="${b.cover?`background-image:url(${b.cover})`:''}">${b.cover?'':'📖'}</div><div class="t">${esc(b.title)}<small>${esc(b.author)}</small></div></div>`).join('')+'</div>'
 :'<div class="emp">Здесь пока пусто.<br>Добавь первую книгу кнопкой «+ Книга».</div>'}

function addBook(){
 head('Новая книга','<button onclick="history.back()">Отмена</button>');
 app.innerHTML=`<label>Название</label><input id="bt"><label>Автор</label><input id="ba"><label>Обложка (из галереи)</label><input type="file" id="bf" accept="image/*"><p><img id="pv" style="max-width:140px;display:none;border:1.5px solid var(--ink)"></p><button class="pri" onclick="saveBook()">Сохранить книгу</button>`;
 $('#bf').onchange=e=>shrink(e.target.files[0],d=>{window._cv=d;$('#pv').src=d;$('#pv').style.display='block'})}
function shrink(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(f)}
function saveBook(){const t=$('#bt').value.trim();if(!t){alert('Впиши название книги');return}
 const b={id:uid(),title:t,author:$('#ba').value.trim(),cover:window._cv||'',chapters:[]};window._cv=null;S.books.push(b);save();go('/b/'+b.id)}

function bk(id){
 const b=book(id);if(!b){go('/');return}
 head(b.title,`<button class="sm" onclick="editBook('${id}')">Изменить</button> <button class="sm pri" onclick="go('/r/${id}')">Повтор</button>`);
 app.innerHTML=(b.chapters.map(c=>`<div class="ch"><span>${esc(c.title)}</span><button class="sm" onclick="addPar('${id}','${c.id}')">+ §</button><button class="sm" onclick="renCh('${id}','${c.id}')">✎</button><button class="sm dng" onclick="delCh('${id}','${c.id}')">×</button></div>`+
 (c.paras.map(p=>`<div class="pr" onclick="go('/p/${id}/${c.id}/${p.id}')"><i class="dot ${p.back?'r':(p.def?'f':'')}"></i><span>${esc(p.title)}</span></div>`).join('')||'<div class="mut">Параграфов пока нет</div>')).join('')||'<div class="emp">Добавь первую главу.</div>')+
 `<p><button class="pri" onclick="addCh('${id}')">+ Глава</button></p><p class="mut" style="font-size:14px">Синяя точка: определение записано. Жёлтая: нужно вернуться.</p>`}
function addCh(id){const t=prompt('Название главы');if(!t)return;book(id).chapters.push({id:uid(),title:t,paras:[]});save();render()}
function renCh(b,c){const x=book(b).chapters.find(k=>k.id==c),t=prompt('Название главы',x.title);if(!t)return;x.title=t;save();render()}
function delCh(b,c){if(!confirm('Удалить главу со всеми конспектами?'))return;const B=book(b);B.chapters=B.chapters.filter(k=>k.id!=c);save();render()}
function addPar(b,c){const t=prompt('Название параграфа');if(!t)return;const p={id:uid(),title:t,def:'',simple:'',notes:'',q:'',back:false};book(b).chapters.find(k=>k.id==c).paras.push(p);save();go(`/p/${b}/${c}/${p.id}`)}
function editBook(id){const b=book(id);
 head('Изменить книгу','<button onclick="history.back()">Назад</button>');
 app.innerHTML=`<label>Название</label><input id="bt" value="${esc(b.title)}"><label>Автор</label><input id="ba" value="${esc(b.author)}"><label>Новая обложка</label><input type="file" id="bf" accept="image/*"><p><button class="pri" onclick="upBook('${id}')">Сохранить</button></p><p><button class="dng" onclick="delBook('${id}')">Удалить книгу</button></p>`;
 $('#bf').onchange=e=>shrink(e.target.files[0],d=>{window._cv=d})}
function upBook(id){const b=book(id);b.title=$('#bt').value.trim()||b.title;b.author=$('#ba').value.trim();if(window._cv){b.cover=window._cv;window._cv=null}save();history.back()}
function delBook(id){if(!confirm('Удалить книгу и все конспекты?'))return;S.books=S.books.filter(b=>b.id!=id);save();go('/')}

function note(bi,ci,pi){
 const b=book(bi),c=b&&b.chapters.find(k=>k.id==ci),p=c&&c.paras.find(k=>k.id==pi);if(!p){go('/');return}
 head(c.title,`<button class="sm dng" onclick="delPar('${bi}','${ci}','${pi}')">Удалить</button>`);
 const F=(k,l,ph)=>`<label class="${k=='def'?'hl':''}">${l}</label><textarea data-k="${k}" placeholder="${ph||''}">${esc(p[k])}</textarea>`;
 app.innerHTML=`<label>Параграф</label><input data-k="title" value="${esc(p.title)}">`+
 F('def','<b>Определение: строго по учебнику</b>','Переписывай слово в слово')+
 F('simple','Простыми словами (моя формулировка, не из учебника)')+
 F('notes','Моё важное: примеры, связи, выводы')+
 F('q','Непонятно / вопросы')+
 `<label style="color:var(--ink)"><input type="checkbox" id="bk" style="width:auto" ${p.back?'checked':''}> Вернуться к этому параграфу</label>`;
 app.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{p[e.dataset.k]=e.value;save()});
 $('#bk').onchange=e=>{p.back=e.target.checked;save()}}
function delPar(b,c,p){if(!confirm('Удалить параграф?'))return;const C=book(b).chapters.find(k=>k.id==c);C.paras=C.paras.filter(k=>k.id!=p);save();history.back()}

function srch(){
 head('Поиск','');app.innerHTML='<input id="sq" placeholder="Слово из любого конспекта"><div id="sr"></div>';
 $('#sq').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(q.length<2){$('#sr').innerHTML='';return}
  let o='';S.books.forEach(b=>b.chapters.forEach(c=>c.paras.forEach(p=>{if([p.title,p.def,p.simple,p.notes,p.q].join(' ').toLowerCase().includes(q))o+=`<div class="hit" onclick="go('/p/${b.id}/${c.id}/${p.id}')">${esc(p.title)}<small>${esc(b.title)} → ${esc(c.title)}</small></div>`})));
  $('#sr').innerHTML=o||'<div class="emp">Ничего не найдено</div>'}}

function rvw(bid){
 head('Повторение','');
 app.innerHTML=`<p>Что повторять?</p><div class="row"><button class="pri g" onclick="startRv('${bid||''}',1)">Только «вернуться»</button><button class="g" onclick="startRv('${bid||''}',0)">Всё с определениями</button></div>`}
function startRv(bid,only){
 rv.q=[];S.books.filter(b=>!bid||b.id==bid).forEach(b=>b.chapters.forEach(c=>c.paras.forEach(p=>{if((p.def||p.simple)&&(!only||p.back))rv.q.push({b:b.title,p})})));
 rv.q.sort(()=>Math.random()-.5);rv.i=0;rv.open=false;card()}
function card(){
 head('Повторение','');
 if(!rv.q.length||rv.i>=rv.q.length){app.innerHTML='<div class="emp">'+(rv.q.length?'Круг закончен.':'Нет подходящих параграфов.')+'</div><p><button onclick="go(\'/r\')">Выбрать снова</button></p>';return}
 const x=rv.q[rv.i],p=x.p;
 app.innerHTML=`<div class="mut">${rv.i+1} из ${rv.q.length} · ${esc(x.b)}</div><div class="card"><b>${esc(p.title)}</b>`+(rv.open?`\n\n${esc(p.def)}${p.simple?'\n\nПростыми словами:\n'+esc(p.simple):''}`:'<p class="mut">Сначала вспомни своими словами, потом открой.</p>')+'</div>'+
 (rv.open?`<div class="row"><button class="g" onclick="mark(true)">Повторить ещё</button><button class="pri g" onclick="mark(false)">Помню</button></div>`:`<button class="pri" onclick="rv.open=true;card()">Показать ответ</button>`)}
function mark(f){rv.q[rv.i].p.back=f;save();rv.i++;rv.open=false;card()}

function bkp(){
 head('Резервная копия','');
 app.innerHTML=`<p class="mut">Копия нужна, если сменишь телефон или переустановишь приложение.</p><button class="pri" onclick="cp()">Скопировать все конспекты</button><label>Восстановить: вставь сюда скопированный текст</label><textarea id="im"></textarea><p><button onclick="imp()">Восстановить</button></p>`}
async function cp(){const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);alert('Скопировано. Вставь в заметки или отправь себе в мессенджер.')}catch(e){$('#im').value=t;$('#im').select();alert('Текст выделен в поле ниже, скопируй его вручную.')}}
function imp(){try{const d=JSON.parse($('#im').value);if(!d.books)throw 0;if(!confirm('Заменить текущие данные скопированными?'))return;S=d;save();go('/')}catch(e){alert('Это не похоже на копию конспектов')}}
render();
</script></body></html>
